name: Build Maui ios

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  build-maui-ios:
    runs-on: macos-26  # Xcode 26 für iOS 26 MAUI workloads
      
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
  
      - name: Select Xcode 26.5
        # The .NET for iOS/MacCatalyst workload (26.5.x) insists on exactly Xcode 26.5,
        # while the macos-26 runner defaults to 26.6. Both are installed on the image.
        run: |
          if [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app
          else
            echo "Xcode 26.5 not found. Installed versions:"
            ls -d /Applications/Xcode*.app
          fi
          xcodebuild -version

      - name: .NET SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'
  
      - name: MAUI workloads installieren
        run: dotnet workload install maui
  
      - name: iOS-Projekt kompilieren für Simulator
        run: dotnet build ./piratechess_maui/piratechess_maui.csproj -f net9.0-ios -c Debug -r iossimulator-x64
        