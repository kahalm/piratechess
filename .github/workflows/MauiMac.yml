name: Build Maui MAC

on:
  release:
    types:
      - published
  workflow_dispatch:
  
jobs:
  build-maui-macos:
    runs-on: macos-26  # Xcode 26 für MAUI macOS workloads

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        # The .NET for iOS/MacCatalyst workload (26.5.x) insists on exactly Xcode 26.5,
        # while the macos-26 runner defaults to 26.6. Both are installed on the image.
        run: |
          if [ -d /Applications/Xcode_26.5.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.5.app
          else
            echo "Xcode 26.5 not found. Installed versions:"
            ls -d /Applications/Xcode*.app
          fi
          xcodebuild -version

      - name: .NET SDK einrichten für MAUI (macOS)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: MAUI workloads installieren
        run: dotnet workload install maui

      - name: Build MAUI Projekt für macOS Catalyst
        run: dotnet build ./piratechess_maui/piratechess_maui.csproj -f net9.0-maccatalyst -p:EnableCodeSigning=false

      - name: Publish MAUI Projekt für macOS (Nicht-Self-Contained)
        # PublishTrimmed must be switched off explicitly: MacCatalyst turns it on by
        # default for Release, and trimming a non-self-contained app fails with NETSDK1102.
        run: dotnet publish ./piratechess_maui/piratechess_maui.csproj -f net9.0-maccatalyst --output ./publish/maui/macos --self-contained false -r maccatalyst-x64 /p:PublishTrimmed=false /p:PublishSingleFile=false /p:PublishReadyToRun=false /p:DebugType=none

      - name: Release-Asset erstellen für macOS
        uses: softprops/action-gh-release@v1
        with:
          files: ./publish/maui/macos/**
        if: ${{ github.event_name == 'release' || github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
